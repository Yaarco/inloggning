<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1>Svampletarna</h1>
        <img src="svamp.jpg" alt="Bild på svamp" srcset="">
    </header>
    <main>
        <section id="login">
            <h2>Logga in</h2>
            <!--För att ge meddelanden som ex "Felaktigt lösenord"-->
            <p id="alert"></p>
            <form method="post" id="login-form">
                <label for="username">Namn</label>
                <input type="text" name="Namn" id="username" required>

                <label for="password">Lösenord</label>
                <input type="password" name="Lösenord" id="password" required>

                <button type="submit" id="login-btn">Logga in</button>
            </form>
        </section>
        <section id="dashboard">
            <h2>Välkommen</h2>
            <p>Välkommen <span></span>, du är nu inloggad</p>
            <button type="button" id="logout-btn">Logga ut</button>
        </section>
    </main>
</body>
</html>
